name: Build dotnet Templates

on:
  pull_request:
    branches:
      - main
    paths:
      - "dotnet/**"
      - ".github/workflows/build-dotnet.yaml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.template.shortName }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - shortName: iwebapi
            projectName: Company.WebApplication1
            runTests: true
          - shortName: iworker
            projectName: Company.Worker1
            runTests: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Pack template
        run: dotnet pack dotnet/Intility.Templates.csproj -c Release -o dotnet/nupkg

      - name: Install template
        run: dotnet new install ./dotnet/nupkg/*.nupkg

      # --no-restore: without it, the restore post-action creates or refreshes
      # packages.lock.json on Linux and masks a missing or stale lock file in the
      # step below.
      - name: Create project from template
        run: |
          dotnet new ${{ matrix.template.shortName }} \
            -n ${{ matrix.template.projectName }} \
            -o ${{ runner.temp }}/${{ matrix.template.shortName }} \
            --argo-project Demo \
            --openshift-namespace aa-demo-dev \
            --github-repo-url https://github.com/intility/demo.git \
            --no-restore

      # Same restore as the reusable dotnet workflow in a generated repo. The test
      # fails when packages.lock.json is missing from the template output, and
      # --locked-mode fails with NU1004 when the lock file does not match the csproj.
      - name: Restore generated project in locked mode
        working-directory: ${{ runner.temp }}/${{ matrix.template.shortName }}
        run: |
          test -f ${{ matrix.template.projectName }}/packages.lock.json
          dotnet restore -r linux-musl-x64 --locked-mode

      - name: Build generated project
        working-directory: ${{ runner.temp }}/${{ matrix.template.shortName }}
        run: dotnet build ${{ matrix.template.projectName }}.slnx -c Release

      - name: Test generated project
        if: matrix.template.runTests
        working-directory: ${{ runner.temp }}/${{ matrix.template.shortName }}
        run: dotnet test ${{ matrix.template.projectName }}.slnx -c Release --no-build
