name: build, test and publish

on:
  push:
    tags:
      - "*"
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    uses: intility/reusable-dotnet/.github/workflows/dotnet.yaml@da86f13447e647a949eacb36204fa9bff64a440c # v1.4.3
    with:
      directory: ./
      docker: ${{ github.event_name != 'pull_request' }}
      locked-mode: true
