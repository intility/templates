name: build, test and publish

on:
  push:
    tags:
      - "*"
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    uses: intility/reusable-dotnet/.github/workflows/dotnet.yaml@a88ae9bdb279ac44f99036782c49d894aa108c4f # v2.0.0
    with:
      directory: ./
      docker: ${{ github.event_name != 'pull_request' }}
      locked-mode: true
