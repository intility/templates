apiVersion: apps/v1
kind: Deployment
metadata:
  name: __CONTAINER_REPOSITORY__
  labels:
    app.openshift.io/runtime: dotnet
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: __CONTAINER_REPOSITORY__
  template:
    metadata:
      labels:
        app: __CONTAINER_REPOSITORY__
    spec:
      # Covers the 15 s preStop sleep, the 30 s default HostOptions.ShutdownTimeout and a 5 s margin, so Kestrel can drain before SIGKILL.
      terminationGracePeriodSeconds: 50
      containers:
        - name: __CONTAINER_REPOSITORY__
          image: ghcr.io/intility/__CONTAINER_REPOSITORY__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            # The sleep delays SIGTERM so the router and endpoints stop sending traffic to this pod first.
            preStop:
              exec:
                command: ["sleep", "15"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 20m
              memory: 128Mi
          envFrom:
            - secretRef:
                name: __CONTAINER_REPOSITORY__-secrets
            - configMapRef:
                name: __CONTAINER_REPOSITORY__-config
